<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="Smart Money Manager - track your finances intelligently">
<title>Smart Money Manager</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Smart%20Money%20Manager%22%2C%22short_name%22%3A%22Money%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%234f46e5%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2527http%253A%2F%2Fwww.w3.org%2F2000%2Fsvg%2527%2520viewBox%253D%25270%25200%252064%252064%2527%253E%253Crect%2520width%253D%252764%2527%2520height%253D%252764%2527%2520rx%253D%252714%2527%2520fill%253D%2527%25234f46e5%2527%2F%253E%253Ctext%2520x%253D%252732%2527%2520y%253D%252742%2527%2520font-size%253D%252734%2527%2520fill%253D%2527white%2527%2520text-anchor%253D%2527middle%2527%2520font-family%253D%2527sans-serif%2527%253E%2524%253C%2Ftext%253E%253C%2Fsvg%253E%22%2C%22sizes%22%3A%2264x64%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --success: #22c55e;
    --danger: #ef4444;
    --warning: #eab308;
    --purple: #a855f7;
    --gray: #94a3b8;
    --bg: #f8fafc;
    --bg-alt: #f1f5f9;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-light: #475569;
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    --radius: 16px;
    --radius-sm: 8px;
}

@media (prefers-color-scheme: dark) {
    :root {
        --bg: #0f172a;
        --bg-alt: #1e293b;
        --card: #1e293b;
        --border: #334155;
        --text: #f1f5f9;
        --text-light: #cbd5e1;
        --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.4);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.5);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}

body {
    background-color: var(--bg);
    color: var(--text);
    padding: 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    transition: background-color 0.3s, color 0.3s;
}

.container { width: 100%; max-width: 1100px; }

header {
    margin-bottom: 30px;
    text-align: center;
    position: relative;
}

header h1 { font-size: 2.5rem; color: var(--primary); margin-bottom: 8px; }
header p { color: var(--text-light); }

.theme-toggle {
    position: absolute;
    right: 0;
    top: 0;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 1.1rem;
    box-shadow: var(--shadow);
}
.theme-toggle:hover { background: var(--bg-alt); }

.dashboard {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform 0.2s, box-shadow 0.2s;
    border: 1px solid var(--border);
}
.card:hover { box-shadow: var(--shadow-lg); }

.card h3 {
    font-size: 0.875rem;
    color: var(--text-light);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.card .amount {
    font-size: 1.875rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.balance-card .amount { color: var(--primary); }
.income-card .amount { color: var(--success); }
.expense-card .amount { color: var(--danger); }

.main-content {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

@media (max-width: 768px) {
    .main-content { grid-template-columns: 1fr; }
    header h1 { font-size: 1.75rem; }
}

.section-title {
    font-size: 1.05rem;
    font-weight: 600;
    margin-bottom: 15px;
    color: var(--text);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

form { display: flex; flex-direction: column; gap: 15px; }

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.form-group { display: flex; flex-direction: column; gap: 5px; }

label {
    font-size: 0.85rem;
    color: var(--text-light);
    font-weight: 500;
}

input, select {
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

button {
    padding: 12px 16px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    font-size: 0.95rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
button:hover { background: var(--primary-hover); }
button:active { transform: scale(0.98); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

button.secondary {
    background: var(--bg-alt);
    color: var(--text);
    border: 1px solid var(--border);
}
button.secondary:hover { background: var(--border); }

button.danger {
    background: #fee2e2;
    color: var(--danger);
}
button.danger:hover { background: #fecaca; }

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

.toolbar input { flex: 1; min-width: 150px; }
.toolbar select { width: auto; min-width: 120px; }

.transaction-list {
    max-height: 450px;
    overflow-y: auto;
    padding-right: 4px;
}

.transaction-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
}

.transaction-item:last-child { border-bottom: none; }

.transaction-info {
    flex: 1;
    min-width: 0;
}

.transaction-info strong {
    font-size: 1rem;
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.transaction-info span {
    font-size: 0.8rem;
    color: var(--text-light);
    display: block;
}

.transaction-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
}

.amount-tag {
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 0.95rem;
    white-space: nowrap;
}
.amount-tag.income { color: var(--success); }
.amount-tag.expense { color: var(--danger); }

.icon-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-light);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.85rem;
    cursor: pointer;
    line-height: 1;
}
.icon-btn:hover { background: var(--bg-alt); color: var(--text); }
.icon-btn.delete:hover { background: #fee2e2; color: var(--danger); border-color: #fecaca; }

.empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-light);
    font-size: 0.95rem;
}

.chart-container { height: 300px; position: relative; }

.budget-item {
    margin-bottom: 14px;
}
.budget-header {
    display: flex;
    justify-content: space-between;
    font-size: 0.9rem;
    margin-bottom: 6px;
}
.budget-header strong { font-weight: 600; }
.budget-bar {
    height: 8px;
    background: var(--bg-alt);
    border-radius: 4px;
    overflow: hidden;
}
.budget-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
    background: var(--success);
}
.budget-fill.warn { background: var(--warning); }
.budget-fill.over { background: var(--danger); }

.budget-form {
    display: grid;
    grid-template-columns: 1fr 100px auto;
    gap: 8px;
    margin-bottom: 15px;
}

@media (max-width: 500px) {
    .budget-form { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
}

.toast-container {
    position: fixed;
    bottom: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    z-index: 1000;
    pointer-events: none;
}

.toast {
    background: var(--card);
    color: var(--text);
    padding: 12px 18px;
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-lg);
    border-left: 4px solid var(--primary);
    animation: slideIn 0.3s ease;
    pointer-events: auto;
    font-size: 0.9rem;
    max-width: 320px;
}
.toast.success { border-left-color: var(--success); }
.toast.error { border-left-color: var(--danger); }
.toast.warning { border-left-color: var(--warning); }

@keyframes slideIn {
    from { opacity: 0; transform: translateX(100%); }
    to { opacity: 1; transform: translateX(0); }
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 999;
    padding: 20px;
}
.modal-overlay.active { display: flex; }

.modal {
    background: var(--card);
    padding: 24px;
    border-radius: var(--radius);
    max-width: 420px;
    width: 100%;
    box-shadow: var(--shadow-lg);
}
.modal h2 { margin-bottom: 16px; font-size: 1.2rem; }
.modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 20px;
}

.sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
}

.full-width { grid-column: span 2; }
@media (max-width: 768px) { .full-width { grid-column: span 1; } }
</style>
</head>
<body>

<div class="container">
    <header>
        <h1>Smart Money Manager</h1>
        <p>Track your wealth with intelligence.</p>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>
    </header>

    <div class="dashboard">
        <div class="card balance-card">
            <h3>Total Balance</h3>
            <div class="amount" id="totalBalance" aria-live="polite">$0.00</div>
        </div>
        <div class="card income-card">
            <h3>Total Income</h3>
            <div class="amount" id="totalIncome" aria-live="polite">$0.00</div>
        </div>
        <div class="card expense-card">
            <h3>Total Expenses</h3>
            <div class="amount" id="totalExpense" aria-live="polite">$0.00</div>
        </div>
        <div class="card">
            <h3>This Month's Balance</h3>
            <div class="amount" id="monthBalance" aria-live="polite">$0.00</div>
        </div>
    </div>

    <div class="main-content">
        <!-- Add form -->
        <div class="card">
            <div class="section-title">Add Transaction</div>
            <form id="transactionForm" novalidate>
                <div class="form-group">
                    <label for="desc">Description</label>
                    <input type="text" id="desc" placeholder="e.g., Groceries, Salary" required maxlength="100" autocomplete="off">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount ($)</label>
                        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="type">Type</label>
                        <select id="type">
                            <option value="income">Income</option>
                            <option value="expense" selected>Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Food">Food</option>
                            <option value="Rent">Rent</option>
                            <option value="Salary">Salary</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Transport">Transport</option>
                            <option value="Utilities">Utilities</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="recurring" style="width: auto;">
                        Recurring transaction (monthly)
                    </label>
                </div>
                <button type="submit">➕ Add Transaction</button>
            </form>
        </div>

        <!-- Spending chart -->
        <div class="card">
            <div class="section-title">Spending Analytics</div>
            <div class="chart-container">
                <canvas id="spendingChart" aria-label="Spending chart by category"></canvas>
            </div>
        </div>

        <!-- Budgets -->
        <div class="card">
            <div class="section-title">Monthly Budgets</div>
            <form class="budget-form" id="budgetForm">
                <select id="budgetCategory" aria-label="Budget category">
                    <option value="Food">Food</option>
                    <option value="Rent">Rent</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Transport">Transport</option>
                    <option value="Utilities">Utilities</option>
                    <option value="Health">Health</option>
                    <option value="Other">Other</option>
                </select>
                <input type="number" id="budgetAmount" placeholder="Amount $" min="1" step="0.01" required aria-label="Budget amount">
                <button type="submit" class="secondary">Set</button>
            </form>
            <div id="budgetList"></div>
        </div>

        <!-- Trend chart -->
        <div class="card">
            <div class="section-title">Balance Trend</div>
            <div class="chart-container">
                <canvas id="trendChart" aria-label="Balance trend over time"></canvas>
            </div>
        </div>

        <!-- Transaction history -->
        <div class="card full-width">
            <div class="section-title">Transaction History</div>
            <div class="toolbar">
                <input type="search" id="searchInput" placeholder="🔍 Search..." aria-label="Search transactions">
                <select id="filterType" aria-label="Filter by type">
                    <option value="all">All</option>
                    <option value="income">Income</option>
                    <option value="expense">Expenses</option>
                </select>
                <select id="filterCategory" aria-label="Filter by category">
                    <option value="all">All categories</option>
                </select>
                <button class="secondary" id="exportJsonBtn" type="button">⬇ JSON</button>
                <button class="secondary" id="exportCsvBtn" type="button">⬇ CSV</button>
                <button class="secondary" id="importBtn" type="button">⬆ Import</button>
                <button class="danger" id="clearAllBtn" type="button">🗑 Clear All</button>
                <input type="file" id="importFile" accept=".json,.csv" hidden>
            </div>
            <div class="transaction-list" id="transactionList"></div>
        </div>
    </div>
</div>

<!-- Edit modal -->
<div class="modal-overlay" id="editModal" role="dialog" aria-modal="true" aria-labelledby="editTitle">
    <div class="modal">
        <h2 id="editTitle">Edit Transaction</h2>
        <form id="editForm">
            <input type="hidden" id="editId">
            <div class="form-group">
                <label for="editDesc">Description</label>
                <input type="text" id="editDesc" required maxlength="100">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="editAmount">Amount ($)</label>
                    <input type="number" id="editAmount" step="0.01" min="0.01" required>
                </div>
                <div class="form-group">
                    <label for="editDate">Date</label>
                    <input type="date" id="editDate" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="editType">Type</label>
                    <select id="editType">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="editCategory">Category</label>
                    <select id="editCategory">
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Salary">Salary</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Health">Health</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="secondary" id="cancelEdit">Cancel</button>
                <button type="submit">Save</button>
            </div>
        </form>
    </div>
</div>

<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="true"></div>

<script>
(() => {
    'use strict';

    // ============ CONSTANTS ============
    const STORAGE_KEY = 'smm_transactions_v2';
    const BUDGET_KEY = 'smm_budgets_v2';
    const THEME_KEY = 'smm_theme';
    const CATEGORIES = ['Food','Rent','Salary','Entertainment','Shopping','Transport','Utilities','Health','Other'];
    const CATEGORY_LABELS = {
        Food: 'Food', Rent: 'Rent', Salary: 'Salary',
        Entertainment: 'Entertainment', Shopping: 'Shopping',
        Transport: 'Transport', Utilities: 'Utilities',
        Health: 'Health', Other: 'Other'
    };
    const CHART_COLORS = ['#4f46e5','#22c55e','#ef4444','#eab308','#a855f7','#94a3b8','#06b6d4','#f97316','#ec4899'];

    // ============ UTILS ============
    const fmt = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    const formatMoney = n => fmt.format(n);
    const uid = () => (crypto.randomUUID?.() ?? Date.now().toString(36) + Math.random().toString(36).slice(2));
    const todayISO = () => new Date().toISOString().slice(0, 10);
    const monthKey = d => d.slice(0, 7); // YYYY-MM

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = String(str);
        return div.innerHTML;
    }

    function debounce(fn, ms = 200) {
        let t;
        return (...args) => {
            clearTimeout(t);
            t = setTimeout(() => fn(...args), ms);
        };
    }

    // ============ TOAST ============
    function toast(message, type = 'info', duration = 3000) {
        const container = document.getElementById('toastContainer');
        const el = document.createElement('div');
        el.className = `toast ${type}`;
        el.textContent = message;
        container.appendChild(el);
        setTimeout(() => {
            el.style.transition = 'opacity 0.3s, transform 0.3s';
            el.style.opacity = '0';
            el.style.transform = 'translateX(100%)';
            setTimeout(() => el.remove(), 300);
        }, duration);
    }

    // ============ STORAGE ============
    function loadJSON(key, fallback) {
        try {
            const raw = localStorage.getItem(key);
            return raw ? JSON.parse(raw) : fallback;
        } catch { return fallback; }
    }
    function saveJSON(key, value) {
        try { localStorage.setItem(key, JSON.stringify(value)); }
        catch (e) { toast('Save error: storage may be full', 'error'); }
    }

    let transactions = loadJSON(STORAGE_KEY, []);
    let budgets = loadJSON(BUDGET_KEY, {});

    function saveTransactions() { saveJSON(STORAGE_KEY, transactions); }
    function saveBudgets() { saveJSON(BUDGET_KEY, budgets); }

    // ============ THEME ============
    function initTheme() {
        const saved = localStorage.getItem(THEME_KEY);
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = saved ? saved === 'dark' : prefersDark;
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
        document.getElementById('themeToggle').textContent = isDark ? '☀️' : '🌙';
        if (saved) applyThemeOverride(isDark);
    }

    function applyThemeOverride(isDark) {
        const root = document.documentElement;
        if (isDark) {
            root.style.setProperty('--bg', '#0f172a');
            root.style.setProperty('--bg-alt', '#1e293b');
            root.style.setProperty('--card', '#1e293b');
            root.style.setProperty('--border', '#334155');
            root.style.setProperty('--text', '#f1f5f9');
            root.style.setProperty('--text-light', '#cbd5e1');
        } else {
            root.style.setProperty('--bg', '#f8fafc');
            root.style.setProperty('--bg-alt', '#f1f5f9');
            root.style.setProperty('--card', '#ffffff');
            root.style.setProperty('--border', '#e2e8f0');
            root.style.setProperty('--text', '#1e293b');
            root.style.setProperty('--text-light', '#475569');
        }
    }

    document.getElementById('themeToggle').addEventListener('click', () => {
        const isDark = document.documentElement.style.colorScheme === 'dark';
        const next = !isDark;
        localStorage.setItem(THEME_KEY, next ? 'dark' : 'light');
        document.documentElement.style.colorScheme = next ? 'dark' : 'light';
        document.getElementById('themeToggle').textContent = next ? '☀️' : '🌙';
        applyThemeOverride(next);
        updateCharts();
    });

    // ============ MONTH NAVIGATION ============
    let currentMonth = monthKey(todayISO());

    function changeMonth(delta) {
        const [y, m] = currentMonth.split('-').map(Number);
        const d = new Date(y, m - 1 + delta, 1);
        currentMonth = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        updateBudgets();
    }

    // ============ RECURRING TRANSACTIONS ============
    function processRecurring() {
        const now = new Date();
        const thisMonth = monthKey(todayISO());
        let added = 0;
        transactions.forEach(t => {
            if (!t.recurring) return;
            const lastDate = new Date(t.date);
            const monthsSince = (now.getFullYear() - lastDate.getFullYear()) * 12 + (now.getMonth() - lastDate.getMonth());
            for (let i = 1; i <= monthsSince; i++) {
                const d = new Date(lastDate.getFullYear(), lastDate.getMonth() + i, lastDate.getDate());
                const newDate = d.toISOString().slice(0, 10);
                if (monthKey(newDate) > t.date.slice(0, 7)) {
                    const exists = transactions.some(x =>
                        x.recurring && x.desc === t.desc && x.amount === t.amount &&
                        x.category === t.category && x.date === newDate
                    );
                    if (!exists && monthKey(newDate) <= thisMonth) {
                        transactions.push({
                            id: uid(), desc: t.desc, amount: t.amount, type: t.type,
                            category: t.category, date: newDate, recurring: true
                        });
                        added++;
                    }
                }
            }
        });
        if (added > 0) {
            saveTransactions();
            toast(`${added} recurring transaction(s) added automatically`, 'success');
        }
    }

    // ============ CALCULATIONS ============
    function getTotals(list = transactions) {
        const income = list.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
        const expenses = list.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
        return { income, expenses, balance: income - expenses };
    }

    function getMonthTotal(month, type) {
        return transactions
            .filter(t => t.type === type && monthKey(t.date) === month)
            .reduce((s, t) => s + t.amount, 0);
    }

    // ============ RENDER ============
    function render() {
        const { income, expenses, balance } = getTotals();
        document.getElementById('totalBalance').textContent = formatMoney(balance);
        document.getElementById('totalIncome').textContent = formatMoney(income);
        document.getElementById('totalExpense').textContent = formatMoney(expenses);

        const monthInc = getMonthTotal(currentMonth, 'income');
        const monthExp = getMonthTotal(currentMonth, 'expense');
        const monthBal = monthInc - monthExp;
        const monthEl = document.getElementById('monthBalance');
        monthEl.textContent = formatMoney(monthBal);
        monthEl.style.color = monthBal >= 0 ? 'var(--success)' : 'var(--danger)';

        renderList();
        renderCategoryFilter();
        updateCharts();
        updateBudgets();
    }

    function renderList() {
        const list = document.getElementById('transactionList');
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const typeFilter = document.getElementById('filterType').value;
        const catFilter = document.getElementById('filterCategory').value;

        let filtered = transactions.slice();
        if (query) {
            filtered = filtered.filter(t =>
                t.desc.toLowerCase().includes(query) ||
                (CATEGORY_LABELS[t.category] || t.category).toLowerCase().includes(query)
            );
        }
        if (typeFilter !== 'all') filtered = filtered.filter(t => t.type === typeFilter);
        if (catFilter !== 'all') filtered = filtered.filter(t => t.category === catFilter);

        filtered.sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

        if (!filtered.length) {
            list.innerHTML = `<p class="empty">${transactions.length ? 'No transactions match your filters.' : 'No transactions yet. Add one above 👆'}</p>`;
            return;
        }

        list.innerHTML = filtered.map(t => {
            const isIncome = t.type === 'income';
            const catLabel = CATEGORY_LABELS[t.category] || t.category;
            return `
                <div class="transaction-item" data-id="${t.id}">
                    <div class="transaction-info">
                        <strong>${escapeHtml(t.desc)}${t.recurring ? ' 🔁' : ''}</strong>
                        <span>${escapeHtml(catLabel)} • ${escapeHtml(t.date)}</span>
                    </div>
                    <div class="transaction-actions">
                        <span class="amount-tag ${isIncome ? 'income' : 'expense'}">
                            ${isIncome ? '+' : '−'} ${formatMoney(t.amount)}
                        </span>
                        <button class="icon-btn" data-action="edit" data-id="${t.id}" aria-label="Edit">✏️</button>
                        <button class="icon-btn delete" data-action="delete" data-id="${t.id}" aria-label="Delete">🗑</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function renderCategoryFilter() {
        const sel = document.getElementById('filterCategory');
        const current = sel.value;
        const used = [...new Set(transactions.map(t => t.category))];
        sel.innerHTML = `<option value="all">All categories</option>` +
            used.map(c => `<option value="${c}">${escapeHtml(CATEGORY_LABELS[c] || c)}</option>`).join('');
        if (used.includes(current)) sel.value = current;
    }

    // ============ CHARTS ============
    let spendingChart = null;
    let trendChart = null;

    function updateCharts() {
        updateSpendingChart();
        updateTrendChart();
    }

    function updateSpendingChart() {
        const canvas = document.getElementById('spendingChart');
        const ctx = canvas.getContext('2d');
        const expenseData = transactions.filter(t => t.type === 'expense');
        const categories = [...new Set(expenseData.map(t => t.category))];
        const totals = {};
        categories.forEach(c => totals[c] = 0);
        expenseData.forEach(t => totals[t.category] += t.amount);

        const labels = categories.map(c => CATEGORY_LABELS[c] || c);
        const data = categories.map(c => totals[c]);
        const colors = categories.map((_, i) => CHART_COLORS[i % CHART_COLORS.length]);

        if (!spendingChart) {
            spendingChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels, datasets: [{ data, backgroundColor: colors, borderWidth: 1, borderColor: 'transparent' }] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { color: getComputedStyle(document.documentElement).getPropertyValue('--text').trim(), padding: 12 } },
                        tooltip: {
                            callbacks: {
                                label: (c) => `${c.label}: ${formatMoney(c.parsed)}`
                            }
                        }
                    },
                    cutout: '60%'
                }
            });
        } else {
            spendingChart.data.labels = labels;
            spendingChart.data.datasets[0].data = data;
            spendingChart.data.datasets[0].backgroundColor = colors;
            spendingChart.options.plugins.legend.labels.color = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
            spendingChart.update();
        }
    }

    function updateTrendChart() {
        const canvas = document.getElementById('trendChart');
        const ctx = canvas.getContext('2d');

        // Cumulative balance by day
        const sorted = transactions.slice().sort((a, b) => a.date.localeCompare(b.date));
        let running = 0;
        const labels = [];
        const data = [];
        sorted.forEach(t => {
            running += t.type === 'income' ? t.amount : -t.amount;
            if (labels[labels.length - 1] !== t.date) {
                labels.push(t.date);
                data.push(running);
            } else {
                data[data.length - 1] = running;
            }
        });

        if (!trendChart) {
            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Balance',
                        data,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 3,
                        pointHoverRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: { label: (c) => formatMoney(c.parsed.y) }
                        }
                    },
                    scales: {
                        y: {
                            ticks: {
                                color: getComputedStyle(document.documentElement).getPropertyValue('--text-light').trim(),
                                callback: v => formatMoney(v)
                            },
                            grid: { color: 'rgba(148,163,184,0.15)' }
                        },
                        x: {
                            ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-light').trim(), maxRotation: 0, autoSkip: true, maxTicksLimit: 6 },
                            grid: { display: false }
                        }
                    }
                }
            });
        } else {
            trendChart.data.labels = labels;
            trendChart.data.datasets[0].data = data;
            trendChart.update();
        }
    }

    // ============ BUDGETS ============
    function updateBudgets() {
        const list = document.getElementById('budgetList');
        const entries = Object.entries(budgets);

        if (!entries.length) {
            list.innerHTML = `<p class="empty" style="padding: 15px;">No budgets set.</p>`;
            return;
        }

        list.innerHTML = entries.map(([cat, limit]) => {
            const spent = transactions
                .filter(t => t.type === 'expense' && t.category === cat && monthKey(t.date) === currentMonth)
                .reduce((s, t) => s + t.amount, 0);
            const pct = Math.min(100, (spent / limit) * 100);
            const cls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';
            return `
                <div class="budget-item">
                    <div class="budget-header">
                        <strong>${escapeHtml(CATEGORY_LABELS[cat] || cat)}</strong>
                        <span>${formatMoney(spent)} / ${formatMoney(limit)}</span>
                    </div>
                    <div class="budget-bar">
                        <div class="budget-fill ${cls}" style="width: ${pct}%"></div>
                    </div>
                    <div style="text-align:right; margin-top:4px;">
                        <button class="icon-btn delete" data-budget-delete="${cat}" aria-label="Delete budget">🗑</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    // ============ EVENTS ============
    // Add transaction
    document.getElementById('transactionForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const desc = document.getElementById('desc').value.trim();
        const amount = parseFloat(document.getElementById('amount').value);
        const date = document.getElementById('date').value;
        const type = document.getElementById('type').value;
        const category = document.getElementById('category').value;
        const recurring = document.getElementById('recurring').checked;

        if (!desc) { toast('Please add a description.', 'error'); return; }
        if (!Number.isFinite(amount) || amount <= 0) { toast('Amount must be a positive number.', 'error'); return; }
        if (!date) { toast('Please choose a date.', 'error'); return; }

        transactions.push({ id: uid(), desc, amount, type, category, date, recurring });
        saveTransactions();
        e.target.reset();
        document.getElementById('date').value = todayISO();
        toast('Transaction added', 'success');
        render();
    });

    // Delete / Edit (event delegation)
    document.getElementById('transactionList').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (!btn) return;
        const id = btn.dataset.id;
        const tx = transactions.find(t => t.id === id);
        if (!tx) return;

        if (btn.dataset.action === 'delete') {
            if (!confirm(`Delete "${tx.desc}"?`)) return;
            transactions = transactions.filter(t => t.id !== id);
            saveTransactions();
            toast('Transaction deleted', 'success');
            render();
        } else if (btn.dataset.action === 'edit') {
            openEditModal(tx);
        }
    });

    // Edit modal
    const editModal = document.getElementById('editModal');
    function openEditModal(tx) {
        document.getElementById('editId').value = tx.id;
        document.getElementById('editDesc').value = tx.desc;
        document.getElementById('editAmount').value = tx.amount;
        document.getElementById('editDate').value = tx.date;
        document.getElementById('editType').value = tx.type;
        document.getElementById('editCategory').value = tx.category;
        editModal.classList.add('active');
        document.getElementById('editDesc').focus();
    }
    function closeEditModal() { editModal.classList.remove('active'); }

    document.getElementById('cancelEdit').addEventListener('click', closeEditModal);
    editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && editModal.classList.contains('active')) closeEditModal(); });

    document.getElementById('editForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const id = document.getElementById('editId').value;
        const tx = transactions.find(t => t.id === id);
        if (!tx) return;
        const desc = document.getElementById('editDesc').value.trim();
        const amount = parseFloat(document.getElementById('editAmount').value);
        if (!desc || !Number.isFinite(amount) || amount <= 0) { toast('Invalid data', 'error'); return; }
        tx.desc = desc;
        tx.amount = amount;
        tx.date = document.getElementById('editDate').value;
        tx.type = document.getElementById('editType').value;
        tx.category = document.getElementById('editCategory').value;
        saveTransactions();
        closeEditModal();
        toast('Transaction updated', 'success');
        render();
    });

    // Filters
    document.getElementById('searchInput').addEventListener('input', debounce(renderList, 150));
    document.getElementById('filterType').addEventListener('change', renderList);
    document.getElementById('filterCategory').addEventListener('change', renderList);

    // Budget
    document.getElementById('budgetForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const cat = document.getElementById('budgetCategory').value;
        const amount = parseFloat(document.getElementById('budgetAmount').value);
        if (!Number.isFinite(amount) || amount <= 0) { toast('Invalid amount', 'error'); return; }
        budgets[cat] = amount;
        saveBudgets();
        e.target.reset();
        toast('Budget set', 'success');
        updateBudgets();
    });

    document.getElementById('budgetList').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-budget-delete]');
        if (!btn) return;
        delete budgets[btn.dataset.budgetDelete];
        saveBudgets();
        toast('Budget deleted', 'success');
        updateBudgets();
    });

    // Export / Import
    function download(filename, content, mime = 'application/json') {
        const blob = new Blob([content], { type: mime });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    document.getElementById('exportJsonBtn').addEventListener('click', () => {
        download(`finances-${todayISO()}.json`, JSON.stringify({ transactions, budgets }, null, 2));
        toast('JSON export complete', 'success');
    });

    document.getElementById('exportCsvBtn').addEventListener('click', () => {
        const header = 'Date,Description,Amount,Type,Category,Recurring\n';
        const rows = transactions.map(t =>
            [t.date, `"${t.desc.replace(/"/g, '""')}"`, t.amount, t.type, t.category, t.recurring ? 'yes' : 'no'].join(',')
        ).join('\n');
        download(`finances-${todayISO()}.csv`, header + rows, 'text/csv;charset=utf-8');
        toast('CSV export complete', 'success');
    });

    document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const text = ev.target.result;
                let imported = [];
                if (file.name.endsWith('.json')) {
                    const parsed = JSON.parse(text);
                    imported = Array.isArray(parsed) ? parsed : (parsed.transactions || []);
                    if (parsed.budgets) { Object.assign(budgets, parsed.budgets); saveBudgets(); }
                } else if (file.name.endsWith('.csv')) {
                    const lines = text.split(/\r?\n/).filter(Boolean);
                    lines.slice(1).forEach(line => {
                        const parts = parseCsvLine(line);
                        if (parts.length < 5) return;
                        const [date, desc, amount, type, category, recurring] = parts;
                        const num = parseFloat(amount);
                        if (!date || !desc || !Number.isFinite(num)) return;
                        imported.push({
                            id: uid(), desc, amount: num, type: type === 'income' ? 'income' : 'expense',
                            category: CATEGORIES.includes(category) ? category : 'Other',
                            date, recurring: recurring === 'yes'
                        });
                    });
                } else {
                    toast('Unsupported format. Please use JSON or CSV.', 'error');
                    return;
                }
                const valid = imported.filter(t => t && t.desc && Number.isFinite(parseFloat(t.amount)));
                valid.forEach(t => {
                    transactions.push({
                        id: uid(), desc: String(t.desc).slice(0, 100),
                        amount: Math.abs(parseFloat(t.amount)),
                        type: t.type === 'income' ? 'income' : 'expense',
                        category: CATEGORIES.includes(t.category) ? t.category : 'Other',
                        date: t.date || todayISO(),
                        recurring: !!t.recurring
                    });
                });
                saveTransactions();
                toast(`${valid.length} transaction(s) imported`, 'success');
                render();
            } catch (err) {
                toast('Import error: ' + err.message, 'error');
            }
        };
        reader.readAsText(file);
        e.target.value = '';
    });

    function parseCsvLine(line) {
        const out = [];
        let cur = '', inQuotes = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') {
                if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
                else inQuotes = !inQuotes;
            } else if (ch === ',' && !inQuotes) {
                out.push(cur); cur = '';
            } else cur += ch;
        }
        out.push(cur);
        return out;
    }

    // Clear all
    document.getElementById('clearAllBtn').addEventListener('click', () => {
        if (!transactions.length) { toast('No data to clear.', 'warning'); return; }
        if (!confirm('Delete ALL transactions? This action cannot be undone.')) return;
        if (!confirm('Are you sure? We recommend exporting first.')) return;
        transactions = [];
        saveTransactions();
        toast('All transactions cleared', 'success');
        render();
    });

    // ============ SERVICE WORKER (offline) ============
    if ('serviceWorker' in navigator) {
        const swCode = `
            const CACHE = 'smm-v2';
            self.addEventListener('install', e => {
                self.skipWaiting();
            });
            self.addEventListener('activate', e => {
                e.waitUntil(clients.claim());
            });
            self.addEventListener('fetch', e => {
                if (e.request.method !== 'GET') return;
                e.respondWith(
                    caches.match(e.request).then(cached => {
                        const network = fetch(e.request).then(res => {
                            if (res.ok && new URL(e.request.url).origin === location.origin) {
                                const clone = res.clone();
                                caches.open(CACHE).then(c => c.put(e.request, clone));
                            }
                            return res;
                        }).catch(() => cached);
                        return cached || network;
                    })
                );
            });
        `;
        try {
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        } catch {}
    }

    // ============ INIT ============
    function init() {
        initTheme();
        document.getElementById('date').value = todayISO();
        processRecurring();
        render();
        // Refresh chart when system theme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (!localStorage.getItem(THEME_KEY)) {
                document.documentElement.style.colorScheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                updateCharts();
            }
        });
    }

    init();
})();
</script>
</body>
</html>
