<style id="ecran-mic">
/* regula casei: ecrane mici (320px) - nimic nu are voie sa iasa din ecran.
   Blocul sta la finalul <head>, deci invinge stilurile de mai sus fara sa le rescrie. */
@media (max-width: 380px) {
  html, body { max-width: 100%; overflow-x: hidden; }
  img, svg, canvas, video, table { max-width: 100%; }
  /* antetul: selectul de limba si butonul de tema se pot strange si trec pe randul urmator */
  header .tools, header .controls, .topbar .tools, .topbar .controls, .tools, .controls { flex-wrap: wrap; min-width: 0; }
  header select, .tools select, .controls select, select#lang, select#lang-select, #lang-select { max-width: 100%; min-width: 0; }
  /* panourile si cardurile se largestesc la cat incape */
  .panel, .card, .sheet, .action, .action-main, .action-side, .source-panel, .panel-heading { min-width: 0; max-width: 100%; }
  .chips, #cityChips { flex-wrap: wrap; }
}
</style>
<style id="tinte-44">
/* regula casei: pe telefon, tinta de atingere are cel putin 44x44px (WCAG 2.5.5, Apple HIG).
   Se aplica doar pe pointer gros sau ecran mic, ca sa nu umfle interfata pe desktop.
   `!important` e intentionat: e un prag de accesibilitate, nu o preferinta de stil, iar
   fiecare unealta are propriile reguli de buton care ar castiga altfel.
   Tabla jocurilor (`.cell`, `.tile`, `.slot`, `.key`) este lasata afara: acolo marimea
   tintei e data de grila, nu de deget, si e tratata in blocul fiecarui joc. */
@media (pointer: coarse), (max-width: 700px) {
  html body :is(button, select, textarea, summary, [role="button"],
      input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="hidden"]),
      label:has(input[type="checkbox"]), label:has(input[type="radio"]),
      .check, .check-label, .switch, .btn, .button):not(.cell):not(.tile):not(.slot):not(.key) {
    min-height: 44px !important;
  }
  html body :is(button, [role="button"], .btn, .button, .chip, .langbtn, .iconbtn, .icon-btn,
      .btn-icon, .icon-button, .swatch, .switch, .tbtn, .buy, .skip):not(.cell):not(.tile):not(.slot):not(.key) {
    display: inline-flex !important; align-items: center !important; justify-content: center !important;
  }
  html body :is(.iconbtn, .icon-btn, .btn-icon, .icon-button, .langbtn, .theme-toggle, .theme,
      .swatch, .switch, .tbtn, .swap, .play-button, .stop-button, .undo, .buy,
      .nav-btn, .editor-close, .round-btn, .chip-x, .close, .btn-close, .randomize-mini,
      .history > button, .swatches > button) {
    min-width: 44px !important; min-height: 44px !important;
  }
  html body :is(select, input[type="color"], input[type="number"], input[type="text"]) {
    min-width: 44px !important;
  }
  html body :is(input[type="checkbox"], input[type="radio"]) { min-width: 24px !important; min-height: 24px !important; }
  /* legaturile din afara textului curent (antet, subsol, navigatie); cele din propozitie
     ramin legaturi de text, cum spune si exceptia pentru text din WCAG 2.5.5.
     Cardurile-legatura isi pastreaza asezarea, doar inaltimea minima creste. */
  html body a:not(p a):not(li a):not(td a):not(.gcard):not(.card) {
    min-height: 44px !important; min-width: 44px !important;
  }
  html body :is(a.skip, .brand, a.buy) { display: inline-flex !important; align-items: center !important; }
  /* barele care nu incapeau: se asaza pe doua randuri in loc sa iasa din ecran */
  html body :is(nav, .nav, .navbar, .toolbar, .links, footer, .footnotes, .player-controls,
      header, .topbar, .masthead, .app-header,
      .topbar-actions, .header-actions, .hero-actions, .actions, .action-row,
      .btn-row, .button-row, .controls, .controls-row, .filters,
      .topbar-inner, .header-inner, .nav-inner, .bar-inner,
      [class$="-inner"], [class$="-actions"]) {
    flex-wrap: wrap !important;
  }
  html body input[type="range"] { height: 44px !important; }
  /* campurile de fisier sunt suprapuse peste zona de tragere si nu trebuie sa iasa din ea */
  html body :is(input[type="file"], input[type="color"], img, video, canvas) { max-width: 100% !important; }
}
</style>

 for(const t of state.transactions){const escaped=/^[\s=+\-@]/.test(t.desc);rows.push([t.id,escaped?"'"+t.desc:t.desc,t.amount,t.type,t.category,t.date,t.recurring,t.recurrenceConfirmed,t.recurrenceStart,t.generatedFrom,t.occurrence,escaped]);}
 return '\uFEFF'+rows.map(r=>r.map(quote).join(',')).join('\r\n');
}
function csvTransactions(text,makeId){
 const rows=parseCSV(text);if(!rows.length)return fail('invalidCSV');const header=rows.shift();let txs=[],legacy=false;
 const modern=['id','desc','amount','type','category','date','recurring','recurrenceConfirmed','recurrenceStart','generatedFrom','occurrence','description_escaped'];
 const oldHeaders=[['Data','Descriere','Suma','Tip','Categorie','Recurenta'],['Date','Description','Amount','Type','Category','Recurring'],['Datum','Opis','Iznos','Tip','Kategorija','Ponavljajuca'],['Датум','Опис','Износ','Тип','Категорија','Понављајућа']];
 const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
 if(same(header,modern)){
  const bool=s=>{if(s==='true')return true;if(s==='false')return false;return fail('invalidCSV');};
  txs=rows.map(r=>{if(r.length!==modern.length)return fail('invalidCSV');const o=Object.fromEntries(modern.map((k,i)=>[k,r[i]]));const escaped=bool(o.description_escaped);if(escaped){if(!o.desc.startsWith("'"))return fail('invalidCSV');o.desc=o.desc.slice(1);}return transaction({...o,recurring:bool(o.recurring),recurrenceConfirmed:bool(o.recurrenceConfirmed),recurrenceStart:o.recurrenceStart||null,generatedFrom:o.generatedFrom||null,occurrence:o.occurrence||null});});
 }else if(oldHeaders.some(h=>same(h,header))){legacy=true;txs=rows.map(r=>{if(r.length!==6)return fail('invalidCSV');const [date,desc,amount,type,category,recur]=r;const b=recur.toLowerCase();if(!['da','yes','да','nu','no','ne','не'].includes(b))return fail('invalidCSV');return transaction({id:makeId(),date,desc,amount,type,category,recurring:['da','yes','да'].includes(b)},true);});}
 else return fail('invalidCSV');return {transactions:txs,legacy};
}
function merge(current,incoming){
 if(current.currency!==incoming.currency)return fail('currencyMismatch');

 const b={...current.budgets};for(const [k,v]of Object.entries(incoming.budgets)){if(own(b,k)&&b[k]!==v)return fail('budgetConflict');b[k]=v;}
 const state=normalize({...current,transactions:[...map.values()],budgets:b,skipped:[...new Set([...current.skipped,...incoming.skipped])]});return {state,added,duplicates};
}

  let installed=false, pending=null, busy=false, error=false, statusKey=null;
  function t(){
    const lang=(document.documentElement.lang||'en').toLowerCase();
    const key=lang.startsWith('sr')?(lang.includes('cyrl')?'sr-cyrl':'sr-latn'):lang.split('-')[0];
    return Object.hasOwn(translations,key)?translations[key]:translations.en;
  }
  function isInstalled(){return installed||standalone.matches||minimal.matches||overlay.matches||navigator.standalone===true;}
  function refresh(){
    const text=t();section.hidden=isInstalled();
    section.setAttribute('aria-label',text.title);
    document.getElementById('td-install-label').textContent=text.install;
    document.getElementById('td-install-title').textContent=text.title;
    document.getElementById('td-install-intro').textContent=error?text.error:text.intro;
    for(const key of ['ios','android','desktop','note','secure'])document.getElementById('td-install-'+key).textContent=text[key];
    document.getElementById('td-install-secure').hidden=isSecureContext&&location.protocol!=='file:';
    close.textContent=text.close;status.textContent=statusKey?text[statusKey]:'';
    if(isInstalled()&&dialog.open)dialog.close();
  }
  function help(failed=false){
    error=failed;refresh();
    if(typeof dialog.showModal==='function'){if(!dialog.open)dialog.showModal();}
    else {const text=t();alert([failed?text.error:text.intro,...(!isSecureContext||location.protocol==='file:'?[text.secure]:[]),text.ios,text.android,text.desktop,text.note].join('\n\n'));}
  }
  window.addEventListener('beforeinstallprompt',event=>{
    if(isInstalled())return;event.preventDefault();pending=event;refresh();
  });
  button.addEventListener('click',async()=>{
    if(busy||isInstalled())return;
    if(!pending||!isSecureContext||location.protocol==='file:'){help();return;}
    const prompt=pending;pending=null;busy=true;button.disabled=true;statusKey=null;refresh();
    try{
      await prompt.prompt();
      const choice=await prompt.userChoice;
      if(!isInstalled())statusKey=choice?.outcome==='accepted'?'accepted':'dismissed';
    }catch(_){help(true);}
    finally{busy=false;button.disabled=false;refresh();}
  });
  close.addEventListener('click',()=>dialog.close());
  window.addEventListener('appinstalled',()=>{installed=true;pending=null;statusKey=null;refresh();});
  for(const query of [standalone,minimal,overlay]){
    if(query.addEventListener)query.addEventListener('change',refresh);
    else if(query.addListener)query.addListener(refresh);
  }
  refresh();
  new MutationObserver(refresh).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
})();
</script>
</body></html>
